<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Musifier{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 600px; margin: 3rem auto; padding: 0 1.25rem; line-height: 1.5; }
    h1 { font-size: 1.6rem; margin-bottom: 0.25rem; }
    p.lead { color: #666; margin-top: 0; }
    .card { border: 1px solid #ccc; border-radius: 10px; padding: 1rem 1.25rem; margin: 1rem 0; }
    .card h2 { margin: 0 0 0.5rem; font-size: 1.15rem; }
    .card-head { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
    .card-head h2 { margin: 0; }
    .card p.lead { margin: 0.3rem 0 0.5rem; }
    label { display: block; font-weight: 600; margin-bottom: 0.35rem; }
    input[type=file] { margin-bottom: 1rem; }
    button, a.button { font: inherit; font-size: 1rem; padding: 0.6rem 1.2rem; border-radius: 8px; border: 1px solid #888; cursor: pointer; background: transparent; color: inherit; text-decoration: none; display: inline-block; line-height: 1.2; }
    button.primary { background: #1f6feb; color: #fff; border-color: #1f6feb; }
    #go { min-width: 12rem; }
    .actions { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; margin-top: 0.5rem; }
    .push-right { margin-left: auto; }
    a.button.small { padding: 0.4rem 0.9rem; font-size: 0.9rem; color: #444; border-color: #bbb; }
    p.small { font-size: 0.9rem; margin: 0.9rem 0 0; }
    [hidden] { display: none !important; }
    .slot { padding: 0.2rem 0 1.3rem; }
    .slot + .slot { border-top: 1px solid #e5e5e5; padding-top: 1.2rem; }
    .slot label { margin-bottom: 0.6rem; }
    .table-wrap { overflow-x: auto; }
    p.hint { font-size: 0.85rem; color: #666; margin: 0.9rem 0 0 0.2rem; }
    p.hint a { color: inherit; }
    .slot .idle, .slot .recording, .slot .ready { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
    .slot small { color: #666; margin-left: 0.2rem; }
    .slot .name { font-weight: 600; }
    .slot .dur { color: #666; }
    .slot audio { height: 32px; max-width: 100%; }
    button.rec::before { content: "●"; color: #d1242f; margin-right: 0.45rem; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #d1242f; display: inline-block; animation: blink 1s infinite; }
    @keyframes blink { 50% { opacity: 0.15; } }
    button:disabled { opacity: 0.6; cursor: wait; }
    .stats { display: flex; gap: 1.5rem; flex-wrap: wrap; margin: 0.5rem 0 1rem; }
    .stats div span { display: block; font-size: 0.8rem; color: #666; }
    .stats div b { font-size: 1.2rem; }
    table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
    th, td { text-align: left; padding: 0.2rem 0.6rem; border-bottom: 1px solid #ddd; }
    details summary { cursor: pointer; margin: 0.5rem 0; }
    #status { color: #666; }
    #status:not(:empty) { margin-top: 1rem; }
    fieldset { border: 1px solid #ccc; border-radius: 8px; margin: 0 0 1rem; padding: 0.75rem 1rem; }
    legend { font-weight: 600; padding: 0 0.3rem; }
    fieldset label { font-weight: normal; }
    fieldset small { color: #666; }
    input[type=range] { width: 100%; margin: 0.2rem 0 0.8rem; }
    label.check { display: flex; gap: 0.5rem; align-items: center; }
    .score { font-size: 3rem; font-weight: 700; line-height: 1; margin: 0.3rem 0; }
    .subscore { font-size: 1.6rem; font-weight: 700; line-height: 1.1; margin: 0.2rem 0; }
    .actions.top { margin: 0.6rem 0 1.25rem; }
    .tag { font-size: 0.75rem; font-weight: normal; color: #666; border: 1px solid #ccc; border-radius: 999px; padding: 0.1rem 0.6rem; vertical-align: middle; margin-left: 0.4rem; }
    label.check span small { display: block; color: #666; }
    .counts span { display: inline-block; margin: 0.4rem 1rem 0 0; }
    .ok { color: #1a7f37; } .octave { color: #0969da; } .wrong { color: #cf222e; font-weight: 600; }
    .missed { color: #888; text-decoration: line-through; } .extra { color: #bc4c00; }
    .warn { background: #fff3cd; color: #664d03; border-radius: 8px; padding: 0.6rem 0.9rem; margin: 0.8rem 0; }
    @media (prefers-color-scheme: dark) { .card, fieldset { border-color: #444; } th, td { border-color: #333; } p.lead, .stats div span, #status, fieldset small, .tag, label.check span small, .slot small, .slot .dur, p.hint { color: #aaa; } a.button.small { color: #ccc; border-color: #555; } .slot + .slot { border-top-color: #333; } .tag { border-color: #444; } .ok { color: #3fb950; } .octave { color: #58a6ff; } .wrong { color: #ff7b72; } .warn { background: #3a2f00; color: #ffd866; } }
  </style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
